<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISL Sign → Speech</title>
<style>
  :root {
    --violet: #8b5cf6;
    --coral: #ff6b6b;
    --gold: #ffd166;
    --ink: #120b23;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.14);
    --text: #f4f1ff;
    --text-dim: #b8adda;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 15%, rgba(139,92,246,0.35), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(255,107,107,0.25), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(255,209,102,0.12), transparent 50%),
      var(--ink);
    color: var(--text);
    font-family: 'Segoe UI', ui-rounded, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .eyebrow .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--coral);
  }
  .eyebrow .dot.live { background: #4ade80; box-shadow: 0 0 8px #4ade80; }

  h1 {
    font-size: 40px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.02em;
    background: linear-gradient(100deg, #fff 30%, var(--gold) 60%, var(--coral) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .layout {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 980px;
    width: 100%;
  }

  .camera-frame {
    position: relative;
    padding: 14px;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }

  .camera-frame::before,
  .camera-frame::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    border-color: var(--violet);
    border-style: solid;
    opacity: 0.9;
  }
  .camera-frame::before {
    top: 6px; left: 6px;
    border-width: 3px 0 0 3px;
    border-top-left-radius: 8px;
  }
  .camera-frame::after {
    bottom: 6px; right: 6px;
    border-width: 0 3px 3px 0;
    border-bottom-right-radius: 8px;
  }

  video {
    display: block;
    width: 400px;
    max-width: 78vw;
    border-radius: 14px;
    background: #000;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--text-dim);
    padding-left: 4px;
  }

  .stage {
    flex: 1 1 340px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
  }

  .prediction-stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    overflow: hidden;
  }

  .prediction-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(139,92,246,0.35), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  .prediction-stage.pulse::before {
    opacity: 1;
  }

  #prediction {
    position: relative;
    font-size: 68px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
    text-shadow: 0 0 30px rgba(139,92,246,0.6);
    transition: transform 0.25s ease;
  }

  .prediction-stage.pulse #prediction {
    transform: scale(1.08);
  }

  #confidence {
    position: relative;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  .history-section {
    margin-top: 20px;
  }

  .history-label {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  #historyText {
    display: block;
    min-height: 50px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--gold);
    word-break: break-all;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  button {
    flex: 1;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  button:hover {
    border-color: var(--violet);
    transform: translateY(-1px);
  }

  footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
    max-width: 520px;
    line-height: 1.6;
  }

  .speaking-indicator {
    display: none;
    align-items: center;
    gap: 4px;
    justify-content: center;
    margin-top: 14px;
    height: 22px;
  }

  .speaking-indicator.active {
    display: flex;
  }

  .speaking-indicator .bar {
    width: 4px;
    height: 6px;
    border-radius: 2px;
    background: var(--gold);
    animation: wave 0.9s ease-in-out infinite;
  }

  .speaking-indicator .bar:nth-child(1) { animation-delay: 0s; }
  .speaking-indicator .bar:nth-child(2) { animation-delay: 0.15s; }
  .speaking-indicator .bar:nth-child(3) { animation-delay: 0.3s; }
  .speaking-indicator .bar:nth-child(4) { animation-delay: 0.45s; }
  .speaking-indicator .bar:nth-child(5) { animation-delay: 0.6s; }

  @keyframes wave {
    0%, 100% { height: 6px; }
    50% { height: 20px; }
  }

  .speaking-label {
    display: none;
    text-align: center;
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    letter-spacing: 0.04em;
  }

  .speaking-label.active {
    display: block;
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow"><span class="dot" id="statusDot"></span><span id="status">Starting camera…</span></div>
    <h1>Sign → Speech</h1>
  </header>

  <div class="layout">
    <div class="camera-frame">
      <video id="video" width="400" height="300" autoplay muted></video>
    </div>

    <div class="stage">
      <div class="prediction-stage" id="predictionStage">
        <div id="prediction">—</div>
        <div id="confidence"></div>
        <div class="speaking-indicator" id="speakingIndicator">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
      </div>
      <div class="speaking-label" id="speakingLabel">Speaking…</div>

      <div class="history-section">
        <div class="history-label">Session history</div>
        <span id="historyText"></span>
      </div>

      <div class="controls">
        <button id="clearBtn">Clear history</button>
        <button id="muteBtn">Mute speech</button>
      </div>
    </div>
  </div>

  <footer>
    MediaPipe hand landmarks → normalized features → neural network classifier → spoken aloud via the browser, live.
  </footer>

<script>
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = 480; canvas.height = 360;
  const ctx = canvas.getContext('2d');
  const predictionDiv = document.getElementById('prediction');
  const confidenceDiv = document.getElementById('confidence');
  const predictionStage = document.getElementById('predictionStage');
  const statusDiv = document.getElementById('status');
  const statusDot = document.getElementById('statusDot');
  const historyText = document.getElementById('historyText');
  const clearBtn = document.getElementById('clearBtn');
  const muteBtn = document.getElementById('muteBtn');
  const speakingIndicator = document.getElementById('speakingIndicator');
  const speakingLabel = document.getElementById('speakingLabel');

  const BACKEND_URL = "http://localhost:8000/predict";

  let lastSpoken = "";
  let speechEnabled = true;
  let history = [];
  let busy = false;

  navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
          video.srcObject = stream;
          statusDiv.innerText = "Camera ready. Perform a sign…";
          statusDot.classList.add('live');
      })
      .catch(err => { statusDiv.innerText = "Webcam error: " + err; });

  async function sendFrame() {
      if (busy) return;
      busy = true;

      try {
          ctx.drawImage(video, 0, 0, 480, 360);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));

          const response = await fetch(BACKEND_URL, {
              method: "POST",
              body: blob,
          });

          const data = await response.json();

          if (data.prediction) {
              predictionDiv.innerText = data.prediction;
              confidenceDiv.innerText = data.confidence
                  ? `Confidence: ${(data.confidence * 100).toFixed(1)}%`
                  : "";

              const isRealPrediction = data.prediction !== "..." && data.prediction !== "No sign detected";

              if (isRealPrediction && data.prediction !== lastSpoken) {
                  lastSpoken = data.prediction;
                  history.push(data.prediction);
                  historyText.innerText = history.join(" ");

                  predictionStage.classList.add('pulse');
                  setTimeout(() => predictionStage.classList.remove('pulse'), 350);

                  if (speechEnabled && "speechSynthesis" in window) {
                      const utterance = new SpeechSynthesisUtterance(data.prediction);
                      utterance.rate = 0.9;
                      utterance.onstart = () => {
                          speakingIndicator.classList.add('active');
                          speakingLabel.classList.add('active');
                      };
                      utterance.onend = () => {
                          speakingIndicator.classList.remove('active');
                          speakingLabel.classList.remove('active');
                      };
                      window.speechSynthesis.speak(utterance);
                  }
              }

              if (!isRealPrediction) {
                  lastSpoken = "";
              }
          }

          statusDiv.innerText = "Connected";
          statusDot.classList.add('live');
      } catch (err) {
          statusDiv.innerText = "Backend error: " + err;
          statusDot.classList.remove('live');
          console.error(err);
      } finally {
          busy = false;
      }
  }

  clearBtn.onclick = () => {
      history = [];
      historyText.innerText = "";
  };

  muteBtn.onclick = () => {
      speechEnabled = !speechEnabled;
      muteBtn.innerText = speechEnabled ? "Mute speech" : "Unmute speech";
  };

  setInterval(sendFrame, 300);
</script>

</body>
</html>
